[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "gmoq"
dynamic = ["version"]
description = "G-MoQ Stage 1: unconditional quantile GWAS by RIF regression"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Michel Nivard", email = "m.g.nivard@bristol.ac.uk"},
    {name = "Fergus Hamilton", email = "fh6520@bristol.ac.uk"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy",
    "bgen>=1.9.7",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "setuptools", "bgen-reader"]   # what the tests need

[project.scripts]
gmoq-stage1 = "gmoq.cli:main"

[tool.setuptools.dynamic]
version = {attr = "gmoq.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["gmoq*"]
