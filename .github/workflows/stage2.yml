name: Stage2

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stage2-tests:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          # Binary packages from Posit Package Manager: no system libraries to build.
          use-public-rspm: true

      - name: Install Stage 2 dependencies
        run: |
          # No --vanilla here: setup-r configures the binary repository in the site profile.
          Rscript -e 'install.packages(c("Rcpp", "RcppArmadillo", "data.table", "R.utils", "Matrix", "ggplot2", "jsonlite", "knitr", "rmarkdown", "testthat"))'

      - name: Install gmoq
        run: |
          R CMD INSTALL stage2

      - name: Run testthat unit tests
        run: |
          Rscript --vanilla -e 'testthat::test_dir("stage2/tests/testthat", package = "gmoq", load_package = "installed", stop_on_failure = TRUE)'

      # R CMD check runs the testthat suite again, the examples and the vignettes.
      - name: R CMD check
        run: |
          R CMD build stage2
          R CMD check --no-manual gmoq_*.tar.gz || { cat gmoq.Rcheck/00check.log; exit 1; }
