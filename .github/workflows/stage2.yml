name: Stage2

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stage2-tests:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          # Binary packages from Posit Package Manager: no system libraries to build.
          use-public-rspm: true

      - name: Install Stage 2 dependencies
        run: |
          Rscript --vanilla -e 'install.packages(c("Rcpp", "RcppArmadillo", "data.table", "R.utils", "Matrix", "ggplot2", "jsonlite", "knitr", "rmarkdown", "testthat"))'

      - name: Install fungwasStage2
        run: |
          R CMD INSTALL stage2

      - name: Run fast Stage 2 regression scripts
        run: |
          for script in test-cov-ids-mandatory.R test-drop-multiallelic-stage1.R \
                        test-multiallelic-stage1-filter.R test-model-tournament.R \
                        test-pooled-covariance.R test-pooled-memory-repair.R test-t-reference.R \
                        test-dispersion-guards.R test-gls-param-gwas.R test-gls-qpval.R \
                        test-q-calibration.R test-q-negative-eigenvalues.R test-multi-taucov.R \
                        test-multi-from-file-unsafe.R test-namespace-dynlib.R; do
            echo "::group::$script"
            Rscript --vanilla "stage2/tests/$script"
            echo "::endgroup::"
          done

      - name: Run testthat unit tests
        run: |
          Rscript --vanilla -e 'testthat::test_dir("stage2/tests/testthat", package = "fungwasStage2", load_package = "installed", stop_on_failure = TRUE)'

      # The standalone scripts above are excluded from the tarball (.Rbuildignore),
      # so R CMD check runs the testthat suite, the examples and the vignettes.
      - name: R CMD check
        run: |
          R CMD build stage2
          R CMD check --no-manual fungwasStage2_*.tar.gz || { cat fungwasStage2.Rcheck/00check.log; exit 1; }
