name: Stage2

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stage2-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"

      - name: Install Stage 2 dependencies
        run: |
          Rscript --vanilla -e 'install.packages(c("Rcpp", "RcppArmadillo", "data.table", "ggplot2", "jsonlite", "knitr", "rmarkdown", "testthat"), repos = "https://cloud.r-project.org")'

      - name: Install fungwasStage2
        run: |
          R CMD INSTALL stage2

      - name: Run fast Stage 2 regression scripts
        run: |
          for script in test-cov-ids-mandatory.R test-model-tournament.R test-pooled-covariance.R test-t-reference.R test-dispersion-guards.R test-gls-qpval.R test-q-negative-eigenvalues.R test-namespace-dynlib.R; do
            Rscript --vanilla "stage2/tests/$script"
          done

      # Legacy demonstration scripts include large simulations and optional data.
      # Run the assertion-based regressions above separately from package checks.
      - name: Build and check installed package structure and examples
        run: |
          R CMD build stage2
          R CMD check --no-manual --no-tests fungwasStage2_*.tar.gz
